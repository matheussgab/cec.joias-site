# /etc/nginx/sites-available/cecjoias.ma24.com
# Publica o site com HTTPS e repassa para a API Node, que escuta só em 127.0.0.1:3000.

server {
  listen 80;
  listen [::]:80;
  server_name cecjoias.ma24.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name cecjoias.ma24.com;

  ssl_certificate     /etc/letsencrypt/live/cecjoias.ma24.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cecjoias.ma24.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;

  # Fotos do painel: até 20 MB por envio.
  client_max_body_size 21m;

  gzip on;
  gzip_types application/json text/css text/javascript application/javascript image/svg+xml;

  # Fotos otimizadas: servidas direto do disco, com cache longo (nomes nunca se repetem).
  location /uploads/ {
    alias /var/lib/cec-joias/uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    # Valor único (não acumulado), para o limite de login não ser burlado.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
